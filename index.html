<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram 2.0 PRO</title>
<style>
:root{--bg:#101820;--panel:#17232e;--panel2:#202e3a;--hover:#293b49;--text:#f1f5f9;--muted:#91a4b4;--blue:#3390ec;--border:#30414e;--green:#40c99a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif;height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100vh;display:flex}.sidebar{width:330px;min-width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{padding:19px;display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800}.logo{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center}.search{padding:0 13px 12px}.search input,.field{width:100%;background:var(--panel2);border:1px solid transparent;border-radius:11px;padding:12px;color:var(--text);outline:none}.search input:focus,.field:focus{border-color:var(--blue)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 12px 12px}.nav button{background:transparent;border:0;border-radius:9px;padding:10px 3px;color:var(--muted);font-size:13px}.nav button.active,.nav button:hover{background:var(--hover);color:var(--blue)}.chat-list{overflow:auto;flex:1}.chat{display:flex;gap:11px;padding:12px 14px;cursor:pointer;border-left:3px solid transparent}.chat:hover,.chat.selected{background:var(--hover)}.chat.selected{border-left-color:var(--blue)}.avatar{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#398ee8,#8059d6);font-size:21px}.chat-info{min-width:0;flex:1}.line{display:flex;justify-content:space-between;gap:5px}.preview,.muted{color:var(--muted);font-size:12px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:68px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px}.topname{font-weight:700}.status{font-size:12px;color:var(--green);margin-top:4px}.actions{margin-left:auto;display:flex;gap:6px}.icon{border:0;background:transparent;color:var(--muted);font-size:20px;padding:8px;border-radius:9px}.icon:hover{background:var(--hover);color:var(--text)}.content{flex:1;overflow:auto}.messages{min-height:100%;padding:24px 7%;display:flex;flex-direction:column;gap:11px;background:radial-gradient(circle at 20% 20%,#20334355,transparent 40%),radial-gradient(circle at 80% 80%,#18394a55,transparent 45%)}.bubble{max-width:min(75%,550px);padding:11px 14px;border-radius:14px;background:var(--panel2);align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#245b83}.bubble small{display:block;text-align:right;color:#c4d8e7;font-size:10px;margin-top:5px}.composer{display:flex;gap:9px;align-items:center;padding:12px 16px;background:var(--panel)}.composer input{flex:1;min-width:0;background:var(--panel2);border:0;border-radius:24px;padding:13px 16px;color:var(--text);outline:0}.send,.primary{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 16px}.send{border-radius:50%;width:44px;height:44px;font-size:18px;padding:0}.page{padding:26px;max-width:1150px;margin:auto}.page h1{margin:0 0 7px}.subtitle{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}.art{height:125px;border-radius:12px;background:linear-gradient(135deg,#283d55,#4c4280);display:grid;place-items:center;font-size:60px}.card h3{margin:12px 0 5px}.price{color:#65c6ff;font-weight:750;margin:12px 0}.primary{width:100%}.profile,.setting{background:var(--panel);border-radius:13px;padding:17px;margin-bottom:10px}.setting{display:flex;justify-content:space-between;align-items:center}.bigavatar{font-size:35px;background:#345e8c;border-radius:50%;width:70px;height:70px;display:grid;place-items:center}.row{display:flex;gap:15px;align-items:center}.empty{text-align:center;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:20}.dialog{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;width:min(420px,100%)}.dialog h2{margin-top:0}.dialog input{margin:7px 0 12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263b4b;padding:12px 20px;border-radius:12px;display:none;z-index:30}.auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:20px}.authbox{width:min(390px,100%);background:var(--panel);padding:25px;border-radius:18px}.authbox h1{margin-top:0}.authbox button{width:100%;margin-top:10px}.hidden{display:none!important}
@media(max-width:700px){.sidebar{width:100%;min-width:0}.main{display:none}body.show-chat .sidebar{display:none}body.show-chat .main{display:flex;width:100%}.page{padding:18px}.messages{padding:18px 4%}.topbar{padding:0 10px}.mobileback{display:inline-block!important}}
.mobileback{display:none}
</style></head><body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">➤</div> Telegram <span style="color:var(--blue)">2.0 PRO</span></div>
<div class="search"><input id="search" placeholder="⌕ Поиск чатов" autocomplete="off"></div>
<nav class="nav">
<button class="active" data-tab="chats">💬 Чаты</button><button data-tab="gifts">🎁 Подарки</button><button data-tab="nft">💎 NFT</button><button data-tab="market">🛍 Маркет</button><button data-tab="profile">👤 Профиль</button><button data-tab="settings">⚙ Настройки</button>
</nav><div class="chat-list" id="chatList"></div>
</aside>
<main class="main"><header class="topbar"><button class="icon mobileback" id="back">←</button><div class="avatar" id="topAvatar">➤</div><div><div class="topname" id="topName">Telegram 2.0</div><div class="status" id="topStatus">Войдите, чтобы начать</div></div><div class="actions"><button class="icon" id="callBtn" title="Видеозвонок">▣</button><button class="icon" id="newChatBtn" title="Новая группа">＋</button></div></header>
<div class="content" id="content"><div class="empty">Войдите в аккаунт, чтобы открыть чаты.</div></div>
<form class="composer hidden" id="composer"><label class="icon" title="Прикрепить файл">＋<input id="file" type="file" hidden></label><input id="message" placeholder="Сообщение..." autocomplete="off"><button type="button" class="icon" id="emoji">☺</button><button class="send">➤</button></form></main></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>
<div class="auth" id="auth"><div class="authbox"><div class="logo">➤</div><h1>Telegram 2.0 PRO</h1><p class="muted">Вход в демонстрационный мессенджер</p><label>Номер телефона</label><input class="field" id="phone" placeholder="+358 40 123 4567"><button class="primary" id="requestCode">Получить код</button><div id="codeArea" class="hidden"><label>Код подтверждения</label><input class="field" id="code" placeholder="Код из сервера"><button class="primary" id="verify">Войти</button><p class="muted">Демо-код показывается после запроса. SMS не отправляется.</p></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem("t2_token"),me=null,socket=null,chats=[],active=null,tab="chats",pendingFile=null;
const emojiMap={gift:"🎁",nft:"💎",market:"🛍"};
function api(url,opts={}){return fetch(url,{...opts,headers:{...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})}}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка запроса");return d})}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function modal(html){$("dialog").innerHTML=html;$("modal").style.display="grid"}
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").style.display="none"};
$("requestCode").onclick=async()=>{try{let d=await api("/api/auth/request-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:$("phone").value})});$("codeArea").classList.remove("hidden");if(d.demoCode)$("code").value=d.demoCode;toast(d.message)}catch(e){toast(e.message)}};
$("verify").onclick=async()=>{try{let d=await api("/api/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:$("phone").value,code:$("code").value})});token=d.token;localStorage.setItem("t2_token",token);await boot()}catch(e){toast(e.message)}};
async function boot(){try{me=await api("/api/me");$("auth").classList.add("hidden");socket=io({auth:{token}});socket.on("connect_error",()=>toast("Ошибка подключения к чату"));socket.on("new-message",m=>{if(active&&m.chat_id===active.id)appendMessage(m);loadChats()});await loadChats();if(chats.length)openChat(chats[0].id);else showWelcome()}catch(e){localStorage.removeItem("t2_token");token=null;$("auth").classList.remove("hidden")}}
async function loadChats(){chats=await api("/api/chats");renderChats()}
function renderChats(){let q=$("search").value.toLowerCase();$("chatList").innerHTML=chats.filter(c=>(c.title+(c.preview||"")).toLowerCase().includes(q)).map(c=>`<div class="chat ${active?.id===c.id?"selected":""}" data-id="${c.id}"><div class="avatar">${c.kind==="group"?"👥":"💬"}</div><div class="chat-info"><div class="line"><b>${esc(c.title)}</b></div><div class="preview">${esc(c.preview||"Начните общение")}</div></div></div>`).join("")||'<div class="empty">Чатов пока нет.<br>Создайте группу кнопкой ＋</div>'}
$("chatList").onclick=e=>{let el=e.target.closest(".chat");if(el)openChat(el.dataset.id)};
$("search").oninput=renderChats;
async function openChat(id){active=chats.find(c=>c.id===id);if(!active)return;document.body.classList.add("show-chat");$("topName").textContent=active.title;$("topAvatar").textContent=active.kind==="group"?"👥":"💬";$("topStatus").textContent=active.kind==="group"?"Группа":"Чат";$("composer").classList.remove("hidden");$("content").innerHTML='<div class="messages" id="messages"><div class="empty">Загрузка сообщений…</div></div>';socket.emit("join-chat",id);let list=await api(`/api/chats/${id}/messages`);$("messages").innerHTML="";list.forEach(appendMessage);renderChats()}
function appendMessage(m){let box=$("messages");if(!box)return;let el=document.createElement("div");el.className="bubble "+(m.user_id===me.id?"mine":"");let name=document.createElement("b");name.textContent=m.user_id===me.id?"Вы":m.name;let text=document.createElement("div");text.textContent=m.text||"";el.append(name,text);if(m.attachment){let a=document.createElement("a");a.href=m.attachment;a.target="_blank";a.textContent="📎 Открыть вложение";el.append(a)}let time=document.createElement("small");time.textContent=new Date(m.created_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});el.append(time);box.append(el);box.scrollTop=box.scrollHeight}
$("composer").onsubmit=async e=>{e.preventDefault();if(!active)return;let text=$("message").value.trim(),attachment=pendingFile;if(!text&&!attachment)return;try{let url=null;if(attachment){let fd=new FormData();fd.append("file",attachment);url=(await api("/api/upload",{method:"POST",body:fd})).url}socket.emit("send-message",{chatId:active.id,text,attachment:url});$("message").value="";$("file").value="";pendingFile=null}catch(err){toast(err.message)}};
$("file").onchange=e=>{pendingFile=e.target.files[0];if(pendingFile)toast("Файл готов к отправке: "+pendingFile.name)};
$("emoji").onclick=()=>$("message").value+=" 😊";
$("back").onclick=()=>document.body.classList.remove("show-chat");
$("newChatBtn").onclick=()=>modal('<h2>Новая группа</h2><label>Название</label><input class="field" id="groupTitle" placeholder="Например, Друзья"><button class="primary" id="createGroup">Создать группу</button>');
$("dialog").onclick=async e=>{if(e.target.id==="createGroup"){try{let d=await api("/api/chats",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("groupTitle").value})});$("modal").style.display="none";await loadChats();openChat(d.id)}catch(err){toast(err.message)}}};
document.querySelector(".nav").onclick=e=>{let b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));document.body.classList.remove("show-chat");$("composer").classList.add("hidden");$("topName").textContent="Telegram 2.0 PRO";$("topAvatar").textContent="➤";$("topStatus").textContent="Ваш цифровой мир";renderPage()};
async function renderPage(){try{if(tab==="chats"){if(active)openChat(active.id);else showWelcome();return}if(tab==="profile"){showProfile();return}if(tab==="settings"){showSettings();return}let items=await api("/api/catalog");let type=tab==="gifts"?"gift":tab==="nft"?"nft":"market";let subset=items.filter(x=>x.kind===type);$("content").innerHTML=`<div class="page"><h1>${emojiMap[tab]} ${tab==="gifts"?"Подарки":tab==="nft"?"NFT Marketplace":"Маркет"}</h1><p class="subtitle">Каталог цифровых товаров и коллекций</p><div class="grid">${subset.map(x=>`<article class="card"><div class="art">${x.emoji}</div><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description)}</p><div class="price">${x.price} ${x.currency}</div><button class="primary buy" data-id="${x.id}">Приобрести</button></article>`).join("")||'<div class="empty">В этом каталоге пока пусто.</div>'}</div></div>`}catch(e){$("content").innerHTML=`<div class="empty">Не удалось загрузить каталог: ${esc(e.message)}<br><button class="primary" onclick="renderPage()">Повторить</button></div>`}}
$("content").onclick=async e=>{let b=e.target.closest(".buy");if(!b)return;try{let d=await api("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:b.dataset.id})});toast(d.message)}catch(err){toast(err.message)}};
function showProfile(){$("content").innerHTML=`<div class="page"><h1>Профиль</h1><div class="profile row"><div class="bigavatar">😎</div><div><h2>${esc(me.name)}</h2><p class="muted">${esc(me.phone)}</p></div></div><div class="setting"><span>⭐ Баланс Stars</span><b>Демо</b></div><div class="setting"><span>💎 NFT</span><b>0</b></div><button class="primary" id="editName">Изменить имя</button><button class="primary" style="margin-top:10px;background:#a34444" id="logout">Выйти</button></div>`;$("editName").onclick=()=>modal('<h2>Изменить имя</h2><input class="field" id="newName" value="'+esc(me.name)+'"><button class="primary" id="saveName">Сохранить</button>');$("logout").onclick=()=>{localStorage.removeItem("t2_token");location.reload()}}
function showSettings(){$("content").innerHTML='<div class="page"><h1>Настройки</h1><div class="setting">Уведомления <input type="checkbox" checked></div><div class="setting">Тёмная тема <input type="checkbox" checked></div><p class="muted">Это стартовый проект. Для production нужны защищённая авторизация, SMS-провайдер, резервное копирование и модерация.</p></div>'}
$("dialog").addEventListener("click",async e=>{if(e.target.id==="saveName"){try{let d=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("newName").value})});me.name=d.name;$("modal").style.display="none";showProfile()}catch(err){toast(err.message)}}});
function showWelcome(){$("content").innerHTML='<div class="empty">Добро пожаловать в Telegram 2.0 PRO 👋<br>Создайте группу кнопкой ＋ или откройте каталог.</div>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("callBtn").onclick=()=>toast("Для реальных аудио/видеозвонков нужен WebRTC UI, TURN-сервер и согласование участников.");
if(token)boot();
</script></body></html>
